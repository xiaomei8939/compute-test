name: bench
on:
  workflow_dispatch:
jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - name: specs
        run: |
          echo "CPUs: $(nproc)"
          free -h
          lscpu | grep -E 'Model name' || true
          df -h / | tail -1
      - name: install ffmpeg
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
      - name: ffmpeg bench
        run: |
          ffmpeg -version | head -1
          ffmpeg -v error -f lavfi -i testsrc2=duration=60:size=1920x1080:rate=30 -c:v libx264 -preset medium -crf 23 src.mp4
          echo "--- timed encode of 30s 1080p, x264 medium ---"
          time ffmpeg -i src.mp4 -t 30 -c:v libx264 -preset medium -crf 23 -an out.mp4 2>&1 | grep -E "time=|speed" | tail -2
